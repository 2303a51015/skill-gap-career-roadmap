<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Career Roadmap & Skill Gap Intelligence System</title>
    <meta name="description" content="AI-Based Skill Gap Analysis and Personalized Career Roadmap Generation System for a Given Resume" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0F172A; color: #FFFFFF; font-family: Inter, system-ui, sans-serif;">
        <div style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; letter-spacing: -0.025em;">
          CareerPath AI
        </div>
        <div style="color: #94A3B8; font-size: 0.88rem;">
          Loading career intelligence platform...
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(event) {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 1)) {
          root.innerHTML = '<div style="background:#0F172A;color:#FFFFFF;padding:2.5rem;font-family:sans-serif;min-height:100vh;"><h2 style="color:#EF4444;margin-bottom:1rem;">Application Startup Notice</h2><p style="color:#94A3B8;margin-bottom:1.5rem;">' + (event.message || 'An error occurred during startup.') + '</p><pre style="background:#1E293B;padding:1rem;border-radius:8px;color:#F1F5F9;overflow:auto;font-size:0.85rem;">' + (event.error ? event.error.stack : '') + '</pre></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
